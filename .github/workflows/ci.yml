name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          python -c "import streamlit, requests, lxml, pandas, openpyxl; print('Imports OK')"
      - run: |
          python -c "from app.scraper import WebScraper; from app.analyzer import build_dataframe; print('Modules OK')"